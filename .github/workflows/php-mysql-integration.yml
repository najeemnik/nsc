name: PHP and MySQL access-control verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-mysql:
    name: PHP ${{ matrix.php }} / ${{ matrix.database.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
        database:
          - name: mysql-8.0
            image: mysql:8.0
          - name: mariadb-10.11
            image: mariadb:10.11
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: nsc_ci_root
          MYSQL_DATABASE: nsc_ci
          MYSQL_USER: nsc_ci
          MYSQL_PASSWORD: nsc_ci_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=nsc_ci_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=10s
    env:
      APP_ENV: test
      APP_SECRET: nsc-ci-only-secret-never-used-outside-disposable-tests
      APP_ALLOWED_ORIGINS: ""
      DB_HOST: 127.0.0.1
      DB_NAME: nsc_ci
      DB_USER: nsc_ci
      DB_PASS: nsc_ci_password
      NSC_INTEGRATION_TEST: "1"
      NSC_EMPLOYEE_ACCESS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mysqli, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends default-mysql-client

      - name: Verify PHP and database service
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: |
          php --version
          mysql --version
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e 'SELECT VERSION() AS database_version'

      - name: Install Node dependencies
        run: npm ci

      - name: Run PHP syntax and policy checks
        run: |
          find api scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/verify-access-control.php

      - name: Apply base schema and migrations to disposable database
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: |
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/nsc_schema.sql
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/migrations/001_workspace_persistence.sql
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/migrations/002_construction_material_accounts.sql
          # A second run checks the migration's idempotent path; this DB is created for this job only.
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/migrations/002_construction_material_accounts.sql
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM nsc_schema_migrations WHERE version = '001_workspace_persistence'")" = 1
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM chart_of_accounts WHERE account_code = '55001'")" = 1
          # Seed unowned legacy rows before migration 003; it must preserve them without guessing a tenant.
          # One separate project's owner is explicitly mapped between migration runs so only that project's budget can inherit it.
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e "INSERT INTO users (id, name, username, email, password_hash, role, is_locked, is_master) VALUES ('nsc-ci-mapped-owner', 'CI mapped owner', 'nsc_ci_mapped_owner', 'nsc-ci-mapped-owner@example.test', 'not-a-login-password-hash', 'admin', 1, 0); INSERT INTO projects (id, project_code, name, approved_budget) VALUES ('nsc-ci-legacy-project', 'NSC-CI-LEGACY', 'CI legacy project', 321.00), ('nsc-ci-mapped-project', 'NSC-CI-MAPPED', 'CI project to map', 456.00); INSERT INTO project_budgets (id, project_id, category_code, category_name, budgeted_amount) VALUES ('nsc-ci-legacy-budget', 'nsc-ci-legacy-project', 'ci', 'CI legacy budget', 123.45), ('nsc-ci-mapped-budget', 'nsc-ci-mapped-project', 'ci', 'CI budget to map', 45.67);"
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/migrations/003_project_tenant_ownership.sql
          # This explicit test mapping is the only source of project ownership; migration 003 must derive its budget owner from it.
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e "UPDATE projects SET tenant_id = 'nsc-ci-mapped-owner' WHERE id = 'nsc-ci-mapped-project';"
          # Re-run to verify idempotence and the safe project-to-budget backfill on both engines.
          mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < database/migrations/003_project_tenant_ownership.sql
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM nsc_schema_migrations WHERE version = '003_project_tenant_ownership'")" = 1
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM projects WHERE id = 'nsc-ci-legacy-project' AND tenant_id IS NULL AND project_code = 'NSC-CI-LEGACY' AND name = 'CI legacy project' AND approved_budget = 321.00")" = 1
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM project_budgets WHERE id = 'nsc-ci-legacy-budget' AND tenant_id IS NULL AND project_id = 'nsc-ci-legacy-project' AND budgeted_amount = 123.45")" = 1
          test "$(mysql --protocol=TCP --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM project_budgets WHERE id = 'nsc-ci-mapped-budget' AND tenant_id = 'nsc-ci-mapped-owner' AND project_id = 'nsc-ci-mapped-project' AND budgeted_amount = 45.67")" = 1

      - name: Run PHP/MySQL HTTP integration and concurrency checks
        env:
          DB_PORT: ${{ job.services.db.ports[3306] }}
        run: npm run verify:access-control-integration

      - name: Run application checks
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run verify:journal
          npm run build
